<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<title>MesajX</title>

<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root{
    --bg:#05070b;
    --sidebar:#090d13;
    --panel:#0b1017;
    --panel2:#101720;
    --panel3:#151d27;

    --text:#f5f7fa;
    --muted:#8995a6;
    --muted2:#596474;

    --accent:#24c8d6;
    --accent2:#6670f5;

    --danger:#ff5368;
    --success:#35d79a;

    --line:rgba(255,255,255,.07);
    --line2:rgba(255,255,255,.13);

    --radius:18px;
    --shadow:0 30px 90px rgba(0,0,0,.45);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    color:var(--text);

    background:
        radial-gradient(
            circle at 80% -10%,
            rgba(36,200,214,.12),
            transparent 32%
        ),
        radial-gradient(
            circle at -10% 100%,
            rgba(102,112,245,.10),
            transparent 35%
        ),
        var(--bg);
}

button,
input,
textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

input,
textarea{
    outline:none;
}

.hidden{
    display:none!important;
}

svg{
    width:19px;
    height:19px;
    stroke-width:2;
}

::-webkit-scrollbar{
    width:5px;
}

::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.13);
    border-radius:99px;
}

/* =========================
   AUTH
========================= */

#authScreen{
    position:fixed;
    inset:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:22px;
}

.auth-card{
    width:min(460px,100%);

    padding:34px;

    border:1px solid var(--line2);
    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(18,26,36,.97),
            rgba(7,10,15,.98)
        );

    box-shadow:var(--shadow);

    backdrop-filter:blur(30px);
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;

    margin-bottom:12px;
}

.logo-icon{
    width:52px;
    height:52px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:17px;

    color:white;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    box-shadow:
        0 15px 35px
        rgba(36,200,214,.18);
}

.logo-title{
    font-size:29px;
    font-weight:950;
    letter-spacing:-1.3px;
}

.logo-title span{
    color:var(--accent);
}

.auth-subtitle{
    color:var(--muted);
    font-size:13px;
    line-height:1.6;
    margin-bottom:24px;
}

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;

    padding:4px;
    margin-bottom:18px;

    border:1px solid var(--line);
    border-radius:14px;

    background:#070a0f;
}

.tab{
    height:40px;

    color:var(--muted);
    background:transparent;

    border-radius:10px;

    font-size:13px;
    font-weight:850;
}

.tab.active{
    color:white;
    background:#151d27;
}

.form{
    display:flex;
    flex-direction:column;
    gap:11px;
}

.field{
    position:relative;
}

.field svg{
    position:absolute;
    left:15px;
    top:50%;

    transform:translateY(-50%);

    color:var(--muted2);
}

.field input{
    width:100%;
    height:53px;

    padding:0 15px 0 45px;

    color:white;
    background:#070b10;

    border:1px solid var(--line);
    border-radius:15px;
}

.field input:focus{
    border-color:rgba(36,200,214,.5);

    box-shadow:
        0 0 0 4px
        rgba(36,200,214,.06);
}

.primary-btn{
    height:53px;

    border-radius:15px;

    color:#001214;

    font-weight:950;

    background:
        linear-gradient(
            135deg,
            #36dce6,
            #159aa8
        );

    transition:.2s;
}

.primary-btn:hover{
    transform:translateY(-1px);
    filter:brightness(1.05);
}

.auth-error{
    min-height:20px;

    margin-top:10px;

    text-align:center;

    color:var(--danger);

    font-size:12px;
}

/* =========================
   APP
========================= */

#app{
    display:none;

    position:fixed;
    inset:0;
}

.app{
    width:100%;
    height:100%;

    display:grid;

    grid-template-columns:
        350px
        minmax(0,1fr)
        310px;
}

/* =========================
   LEFT SIDEBAR
========================= */

.sidebar{
    min-width:0;

    display:flex;
    flex-direction:column;

    background:
        rgba(8,12,18,.97);

    border-right:1px solid var(--line);
}

.sidebar-top{
    padding:19px 17px 15px;

    border-bottom:1px solid var(--line);
}

.me{
    display:flex;
    align-items:center;
    gap:11px;
}

.avatar{
    width:46px;
    height:46px;
    flex:0 0 46px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:15px;

    color:white;

    font-weight:950;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );
}

.me-info{
    min-width:0;
    flex:1;
}

.me-name{
    font-size:14px;
    font-weight:900;

    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.me-code{
    margin-top:3px;

    color:var(--accent);

    font-size:10px;
    font-weight:850;
}

.icon-btn{
    width:41px;
    height:41px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:var(--muted);

    background:#111821;

    border:1px solid var(--line);

    border-radius:13px;
}

.icon-btn:hover{
    color:white;
    background:#18222d;
}

.search{
    position:relative;
    margin-top:15px;
}

.search svg{
    position:absolute;

    left:13px;
    top:50%;

    transform:translateY(-50%);

    color:var(--muted2);
}

.search input{
    width:100%;
    height:45px;

    padding:0 13px 0 40px;

    color:white;
    background:#070b10;

    border:1px solid var(--line);

    border-radius:14px;
}

.section-title{
    padding:16px 18px 8px;

    color:#657183;

    font-size:10px;
    font-weight:950;

    letter-spacing:1.4px;
}

.chat-list{
    flex:1;
    min-height:0;

    overflow:auto;

    padding:2px 9px 14px;
}

.chat{
    position:relative;

    display:flex;
    align-items:center;

    gap:11px;

    padding:11px 10px;

    border-radius:17px;

    cursor:pointer;
}

.chat:hover{
    background:rgba(255,255,255,.035);
}

.chat.active{
    background:
        linear-gradient(
            90deg,
            rgba(36,200,214,.12),
            rgba(36,200,214,.025)
        );
}

.chat.active::before{
    content:"";

    position:absolute;

    left:0;
    top:12px;
    bottom:12px;

    width:3px;

    border-radius:99px;

    background:var(--accent);
}

.chat-avatar{
    width:46px;
    height:46px;

    flex:0 0 46px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:15px;

    color:white;

    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #1e8f9c,
            #4c45b5
        );
}

.chat-info{
    min-width:0;
    flex:1;
}

.chat-top{
    display:flex;
    align-items:center;
    gap:6px;
}

.chat-name{
    flex:1;
    min-width:0;

    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;

    font-size:13px;
    font-weight:850;
}

.chat-time{
    color:var(--muted2);
    font-size:10px;
}

.chat-preview{
    margin-top:4px;

    color:var(--muted);

    font-size:11px;

    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.empty{
    padding:40px 20px;

    text-align:center;

    color:var(--muted);
    font-size:12px;
}

.sidebar-bottom{
    display:flex;
    gap:8px;

    padding:10px;

    border-top:1px solid var(--line);
}

.bottom-btn{
    flex:1;

    height:44px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;

    color:var(--muted);

    background:#101720;

    border:1px solid var(--line);

    border-radius:13px;

    font-size:11px;
    font-weight:800;
}

.bottom-btn:hover{
    color:white;
}

/* =========================
   CENTER CHAT
========================= */

.chat-area{
    min-width:0;
    min-height:0;

    display:flex;
    flex-direction:column;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(36,200,214,.035),
            transparent 40%
        ),
        #080c12;
}

.chat-header{
    height:76px;

    flex:0 0 76px;

    display:flex;
    align-items:center;

    gap:12px;

    padding:0 20px;

    border-bottom:1px solid var(--line);

    background:rgba(9,13,19,.82);

    backdrop-filter:blur(18px);
}

.mobile-back{
    display:none;
}

.header-avatar{
    width:44px;
    height:44px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:14px;

    color:white;

    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #1d929e,
            #4b44b2
        );
}

.header-info{
    min-width:0;
    flex:1;
}

.header-name{
    font-size:14px;
    font-weight:900;
}

.header-status{
    display:flex;
    align-items:center;
    gap:5px;

    margin-top:3px;

    color:var(--muted);

    font-size:10px;
}

.status-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:var(--success);
}

.header-actions{
    display:flex;
    gap:7px;
}

.messages{
    flex:1;
    min-height:0;

    overflow-y:auto;

    padding:24px 5% 25px;
}

.day{
    display:flex;
    justify-content:center;

    margin:8px 0 22px;
}

.day span{
    padding:6px 10px;

    color:var(--muted2);

    background:#0e141d;

    border:1px solid var(--line);

    border-radius:20px;

    font-size:9px;
    font-weight:800;
}

.message-row{
    display:flex;

    margin-bottom:8px;
}

.message-row.mine{
    justify-content:flex-end;
}

.message{
    max-width:min(72%,620px);

    position:relative;

    padding:10px 12px 8px;

    border:1px solid var(--line);

    border-radius:17px;

    background:#111821;
}

.message-row.mine .message{
    background:
        linear-gradient(
            135deg,
            rgba(24,145,156,.9),
            rgba(40,91,126,.95)
        );

    border-color:rgba(255,255,255,.08);

    border-bottom-right-radius:5px;
}

.message-row:not(.mine) .message{
    border-bottom-left-radius:5px;
}

.message-text{
    white-space:pre-wrap;
    word-break:break-word;

    font-size:13px;
    line-height:1.48;
}

.message-meta{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:4px;

    margin-top:4px;

    color:rgba(255,255,255,.52);

    font-size:9px;
}

.edited{
    font-style:italic;
}

.message-menu{
    position:absolute;

    right:8px;
    top:100%;

    z-index:20;

    width:155px;

    padding:6px;

    background:#151d27;

    border:1px solid var(--line2);

    border-radius:13px;

    box-shadow:var(--shadow);
}

.message-menu button{
    width:100%;

    display:flex;
    align-items:center;
    gap:8px;

    padding:9px;

    color:var(--text);

    background:transparent;

    border-radius:9px;

    text-align:left;

    font-size:11px;
}

.message-menu button:hover{
    background:rgba(255,255,255,.06);
}

.message-menu .danger{
    color:var(--danger);
}

.reactions{
    display:flex;
    gap:4px;

    margin-top:5px;
}

.reaction{
    padding:3px 6px;

    border-radius:10px;

    color:white;

    background:rgba(0,0,0,.2);

    font-size:11px;
}

/* =========================
   COMPOSER
========================= */

.composer{
    flex:0 0 auto;

    display:flex;
    align-items:flex-end;
    gap:8px;

    padding:
        11px
        20px
        max(11px,env(safe-area-inset-bottom));

    border-top:1px solid var(--line);

    background:
        rgba(8,12,18,.94);

    backdrop-filter:blur(18px);
}

.compose-icon{
    width:44px;
    height:44px;

    flex:0 0 44px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:var(--muted);

    background:#111821;

    border:1px solid var(--line);

    border-radius:14px;
}

.compose-icon:hover{
    color:white;
}

.message-input{
    min-height:44px;
    max-height:130px;

    flex:1;

    resize:none;

    padding:12px 13px;

    color:white;

    background:#0d131b;

    border:1px solid var(--line2);

    border-radius:15px;

    line-height:1.35;

    overflow-y:auto;
}

.message-input:focus{
    border-color:rgba(36,200,214,.4);
}

.send-btn{
    width:48px;
    height:44px;

    flex:0 0 48px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#001315;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #31dce6,
            #1aa3b1
        );
}

.send-btn:hover{
    filter:brightness(1.08);
}

/* =========================
   RIGHT PROFILE
========================= */

.right-panel{
    min-width:0;

    padding:18px;

    overflow:auto;

    border-left:1px solid var(--line);

    background:
        rgba(9,13,19,.93);
}

.profile-card{
    padding:22px;

    border:1px solid var(--line);

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            rgba(18,26,36,.8),
            rgba(10,14,20,.8)
        );
}

.profile-avatar{
    width:82px;
    height:82px;

    margin:2px auto 13px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:25px;

    color:white;

    font-size:25px;
    font-weight:950;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );
}

.profile-card h2{
    text-align:center;

    font-size:18px;
}

.profile-username{
    margin-top:4px;

    text-align:center;

    color:var(--muted);

    font-size:11px;
}

.code-box{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:8px;

    margin-top:18px;
    padding:11px;

    border-radius:13px;

    background:#080c12;

    border:1px solid var(--line);
}

.code-box div{
    min-width:0;
}

.code-label{
    color:var(--muted2);
    font-size:9px;
}

.code-value{
    margin-top:3px;

    color:var(--accent);

    font-size:11px;
    font-weight:900;
}

.copy-btn{
    width:34px;
    height:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    background:#151e28;

    border:1px solid var(--line);

    border-radius:10px;
}

.profile-section{
    margin-top:17px;
}

.profile-section-title{
    margin-bottom:8px;

    color:#687487;

    font-size:9px;
    font-weight:950;

    letter-spacing:1.2px;
}

.profile-action{
    width:100%;

    display:flex;
    align-items:center;
    gap:10px;

    padding:12px;

    color:var(--text);

    background:#0e151e;

    border:1px solid var(--line);

    border-radius:13px;

    font-size:11px;
    font-weight:750;

    text-align:left;
}

.profile-action + .profile-action{
    margin-top:7px;
}

.profile-action:hover{
    background:#151e28;
}

.profile-action.danger{
    color:var(--danger);
}

/* =========================
   MODALS
========================= */

.modal{
    position:fixed;
    inset:0;

    z-index:2000;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.65);

    backdrop-filter:blur(9px);
}

.modal-card{
    width:min(480px,100%);

    max-height:90vh;

    overflow:auto;

    padding:22px;

    background:#0d131b;

    border:1px solid var(--line2);

    border-radius:24px;

    box-shadow:var(--shadow);
}

.modal-head{
    display:flex;
    align-items:center;

    gap:10px;

    margin-bottom:18px;
}

.modal-head h2{
    flex:1;

    font-size:17px;
}

.close{
    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:var(--muted);

    background:#151d27;

    border:1px solid var(--line);

    border-radius:11px;
}

.modal-search{
    position:relative;
}

.modal-search svg{
    position:absolute;

    left:13px;
    top:50%;

    transform:translateY(-50%);

    color:var(--muted2);
}

.modal-search input{
    width:100%;
    height:47px;

    padding-left:40px;

    color:white;

    background:#070b10;

    border:1px solid var(--line);

    border-radius:13px;
}

.people{
    margin-top:12px;
}

.person{
    display:flex;
    align-items:center;
    gap:10px;

    padding:10px;

    border-radius:14px;
}

.person:hover{
    background:rgba(255,255,255,.035);
}

.person-info{
    min-width:0;
    flex:1;
}

.person-name{
    font-size:12px;
    font-weight:850;
}

.person-code{
    margin-top:3px;

    color:var(--accent);

    font-size:9px;
}

.person-add{
    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    background:#151e28;

    border:1px solid var(--line);

    border-radius:11px;
}

/* =========================
   TOAST
========================= */

#toast{
    position:fixed;

    left:50%;
    bottom:25px;

    z-index:5000;

    transform:
        translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    padding:11px 15px;

    color:white;

    background:#151d27;

    border:1px solid var(--line2);

    border-radius:13px;

    box-shadow:var(--shadow);

    font-size:11px;
    font-weight:800;

    transition:.22s;
}

#toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:1050px){

    .app{
        grid-template-columns:
            320px
            minmax(0,1fr);
    }

    .right-panel{
        display:none;
    }
}

@media(max-width:720px){

    .app{
        display:block;
    }

    .sidebar{
        position:absolute;
        inset:0;

        width:100%;

        z-index:20;
    }

    .chat-area{
        position:absolute;
        inset:0;

        z-index:30;

        transform:translateX(100%);

        transition:.25s;
    }

    .app.chat-open .chat-area{
        transform:translateX(0);
    }

    .mobile-back{
        display:flex;
    }

    .chat-header{
        height:68px;
        flex-basis:68px;

        padding:0 11px;
    }

    .header-actions .hide-mobile{
        display:none;
    }

    .messages{
        padding:18px 12px 20px;
    }

    .message{
        max-width:84%;
    }

    .composer{
        padding:
            8px
            9px
            max(8px,env(safe-area-inset-bottom));
    }

    .compose-icon{
        width:41px;
        height:41px;
        flex-basis:41px;
    }

    .send-btn{
        width:45px;
        flex-basis:45px;
    }

    .auth-card{
        padding:25px 20px;
        border-radius:25px;
    }
}

/* =========================
   VERY SMALL
========================= */

@media(max-width:390px){

    .compose-icon{
        display:none;
    }

    .message{
        max-width:89%;
    }

    .header-avatar{
        width:40px;
        height:40px;
    }
}
</style>
</head>

<body>

<!-- =========================
     AUTH
========================= -->

<section id="authScreen">

    <div class="auth-card">

        <div class="logo">

<div id="toast"></div>

<script>
"use strict";

/* =========================
   STATE
========================= */

let socket = null;
let token = null;
let me = null;

let chats = [];
let currentChat = null;
let currentMessages = [];

let typingTimer = null;
let searchTimer = null;

const TOKEN_KEY = "mesajx_token";

/* =========================
   INIT
========================= */

document.addEventListener("DOMContentLoaded", () => {

    lucide.createIcons();

    token = localStorage.getItem(TOKEN_KEY);

    if(token){
        bootWithToken();
    }

});

/* =========================
   AUTH UI
========================= */

function switchAuth(type){

    const loginTab =
        document.getElementById("loginTab");

    const registerTab =
        document.getElementById("registerTab");

    const loginForm =
        document.getElementById("loginForm");

    const registerForm =
        document.getElementById("registerForm");

    const error =
        document.getElementById("authError");

    error.textContent = "";

    if(type === "login"){

        loginTab.classList.add("active");
        registerTab.classList.remove("active");

        loginForm.classList.remove("hidden");
        registerForm.classList.add("hidden");

    }else{

        loginTab.classList.remove("active");
        registerTab.classList.add("active");

        loginForm.classList.add("hidden");
        registerForm.classList.remove("hidden");

    }
}

/* =========================
   REGISTER
========================= */

async function register(event){

    event.preventDefault();

    const name =
        document.getElementById("registerName")
            .value.trim();

    const username =
        document.getElementById("registerUsername")
            .value.trim();

    const pin =
        document.getElementById("registerPin")
            .value.trim();

    setAuthError("");

    try{

        const response =
            await fetch("/api/register", {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    name,
                    username,
                    pin
                })

            });

        const data =
            await response.json();

        if(!response.ok || !data.success){
            throw new Error(
                data.error ||
                "Hesap oluşturulamadı."
            );
        }

        token = data.token;

        localStorage.setItem(
            TOKEN_KEY,
            token
        );

        me = data.user;

        showApp();

        showToast(
            `Hesabın hazır. Kodun: ${data.code}`
        );

    }catch(error){

        setAuthError(
            error.message
        );

    }
}

/* =========================
   LOGIN
========================= */

async function login(event){

    event.preventDefault();

    const identifier =
        document.getElementById("loginIdentifier")
            .value.trim();

    const pin =
        document.getElementById("loginPin")
            .value.trim();

    setAuthError("");

    try{

        const response =
            await fetch("/api/login", {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    identifier,
                    pin
                })

            });

        const data =
            await response.json();

        if(!response.ok || !data.success){
            throw new Error(
                data.error ||
                "Giriş başarısız."
            );
        }

        token = data.token;

        localStorage.setItem(
            TOKEN_KEY,
            token
        );

        me = data.user;

        showApp();

    }catch(error){

        setAuthError(
            error.message
        );

    }
}

/* =========================
   TOKEN BOOT
========================= */

async function bootWithToken(){

    try{

        const response =
            await fetch("/api/me", {

                headers:{
                    Authorization:
                        `Bearer ${token}`
                }

            });

        const data =
            await response.json();

        if(!response.ok || !data.success){
            throw new Error();
        }

        me = data.user;

        showApp();

    }catch{

        localStorage.removeItem(
            TOKEN_KEY
        );

        token = null;

    }
}

/* =========================
   SHOW APP
========================= */

function showApp(){

    document.getElementById(
        "authScreen"
    ).style.display = "none";

    document.getElementById(
        "app"
    ).style.display = "block";

    updateMyUI();

    connectSocket();

    lucide.createIcons();

}

/* =========================
   SOCKET
========================= */

function connectSocket(){

    if(socket){
        socket.disconnect();
    }

    socket = io();

    socket.on("connect", () => {

        socket.emit(
            "authenticate",
            {token},
            result => {

                if(!result?.success){

                    showToast(
                        result?.error ||
                        "Kimlik doğrulanamadı."
                    );

                    logout();

                    return;
                }

                me = result.user;

                updateMyUI();

                loadChats();

            }
        );

    });

    socket.on("connect_error", () => {

        showToast(
            "Sunucu bağlantısı kurulamadı."
        );

    });

    socket.on(
        "new_message",
        message => {

            handleIncomingMessage(
                message
            );

        }
    );

    socket.on(
        "message_edited",
        message => {

            if(
                currentChat &&
                message.chatId ===
                currentChat.id
            ){

                const index =
                    currentMessages.findIndex(
                        m =>
                            m.id === message.id
                    );

                if(index >= 0){

                    currentMessages[index] =
                        message;

                    renderMessages();

                }

            }

            updateChatPreview(
                message.chatId
            );

        }
    );

    socket.on(
        "message_deleted",
        message => {

            if(
                currentChat &&
                message.chatId ===
                currentChat.id
            ){

                const index =
                    currentMessages.findIndex(
                        m =>
                            m.id === message.id
                    );

                if(index >= 0){

                    currentMessages[index] =
                        message;

                    renderMessages();

                }

            }

            updateChatPreview(
                message.chatId
            );

        }
    );

    socket.on(
        "message_reaction",
        message => {

            if(
                currentChat &&
                message.chatId ===
                currentChat.id
            ){

                const index =
                    currentMessages.findIndex(
                        m =>
                            m.id === message.id
                    );

                if(index >= 0){

                    currentMessages[index] =
                        message;

                    renderMessages();

                }

            }

        }
    );

    socket.on(
        "typing",
        data => {

            if(
                currentChat &&
                data.chatId ===
                currentChat.id
            ){

                const status =
                    document.getElementById(
                        "headerStatus"
                    );

                if(data.typing){

                    status.innerHTML = `
                        <span class="status-dot"></span>
                        <span>${escapeHTML(
                            data.name
                        )} yazıyor...</span>
                    `;

                }else{

                    setOnlineStatus();

                }

            }

        }
    );

    socket.on(
        "chat_created",
        () => {

            loadChats();

        }
    );
}

/* =========================
   LOAD CHATS
========================= */

function loadChats(){

    if(!socket) return;

    socket.emit(
        "get_chats",
        result => {

            if(!result?.success){

                showToast(
                    result?.error ||
                    "Sohbetler yüklenemedi."
                );

                return;
            }

            chats =
                Array.isArray(result.chats)
                    ? result.chats
                    : [];

            renderChats();

        }
    );
}

/* =========================
   RENDER CHATS
========================= */

function renderChats(){

    const container =
        document.getElementById(
            "chatList"
        );

    const search =
        document.getElementById(
            "chatSearch"
        ).value
            .trim()
            .toLowerCase();

    const filtered =
        chats.filter(chat => {

            if(!search) return true;

            return (
                String(chat.name || "")
                    .toLowerCase()
                    .includes(search) ||

                String(
                    chat.otherUser?.code || ""
                )
                    .toLowerCase()
                    .includes(search) ||

                String(
                    chat.otherUser?.username || ""
                )
                    .toLowerCase()
                    .includes(search)
            );

        });

    if(!filtered.length){

        container.innerHTML = `
            <div class="empty">
                <i data-lucide="message-square-off"></i>
                <br><br>
                Henüz sohbet yok.
            </div>
        `;

        lucide.createIcons();

        return;
    }

    container.innerHTML =
        filtered.map(chat => {

            const active =
                currentChat?.id === chat.id;

            const other =
                chat.otherUser;

            const name =
                chat.name ||
                other?.name ||
                "Sohbet";

            const initial =
                getInitial(name);

            const preview =
                chat.lastMessage?.text ||
                "Henüz mesaj yok";

            return `
                <div
                    class="chat ${active ? "active" : ""}"
                    onclick="openChat('${chat.id}')">

                    <div class="chat-avatar">
                        ${escapeHTML(initial)}
                    </div>

                    <div class="chat-info">

                        <div class="chat-top">

                            <div class="chat-name">
                                ${escapeHTML(name)}
                            </div>

                            <div class="chat-time">
                                ${formatTime(
                                    chat.lastMessage?.createdAt ||
                                    chat.createdAt
                                )}
                            </div>

                        </div>

                        <div class="chat-preview">
                            ${escapeHTML(preview)}
                        </div>

                    </div>

                </div>
            `;

        }).join("");

}

/* =========================
   OPEN CHAT
========================= */

function openChat(chatId){

    const chat =
        chats.find(
            c => c.id === chatId
        );

    if(!chat) return;

    currentChat = chat;

    document
        .getElementById("appShell")
        .classList.add("chat-open");

    updateHeader();

    renderChats();

    loadMessages(chat.id);

}

/* =========================
   LOAD MESSAGES
========================= */

function loadMessages(chatId){

    socket.emit(
        "get_messages",
        {chatId},

        result => {

            if(!result?.success){

                showToast(
                    result?.error ||
                    "Mesajlar yüklenemedi."
                );

                return;
            }

            currentMessages =
                Array.isArray(
                    result.messages
                )
                    ? result.messages
                    : [];

            renderMessages();

        }
    );
}

/* =========================
   RENDER MESSAGES
========================= */

function renderMessages(){

    const container =
        document.getElementById(
            "messages"
        );

    if(!currentChat){

        container.innerHTML = `
            <div class="empty">
                Bir sohbet seç.
            </div>
        `;

        return;
    }

    if(!currentMessages.length){

        container.innerHTML = `
            <div class="empty">
                <i data-lucide="messages-square"></i>
                <br><br>
                Bu sohbette henüz mesaj yok.
                <br>
                İlk mesajı sen gönder.
            </div>
        `;

        lucide.createIcons();

        return;
    }

    let lastDate = "";

    container.innerHTML =
        currentMessages.map(message => {

            const date =
                new Date(
                    message.createdAt
                );

            const dateKey =
                date.toLocaleDateString(
                    "tr-TR"
                );

            let separator = "";

            if(dateKey !== lastDate){

                separator = `
                    <div class="day">
                        <span>
                            ${escapeHTML(
                                dateKey
                            )}
                        </span>
                    </div>
                `;

                lastDate = dateKey;

            }

            const mine =
                message.senderId ===
                me.id;

            const deleted =
                message.deleted;

            const text =
                deleted
                    ? "Bu mesaj silindi."
                    : message.text;

            const reactionHTML =
                renderReactions(
                    message
                );

            return `
                ${separator}

                <div
                    class="message-row ${
                        mine ? "mine" : ""
                    }">

                    <div
                        class="message"
                        data-message-id="${message.id}">

                        <div class="message-text ${
                            deleted ? "edited" : ""
                        }">
                            ${escapeHTML(text)}
                        </div>

                        <div class="message-meta">

                            ${
                                message.edited && !deleted
                                    ? `<span class="edited">düzenlendi</span>`
                                    : ""
                            }

                            <span>
                                ${formatTime(
                                    message.createdAt
                                )}
                            </span>

                            ${
                                mine
                                    ? `<span>✓</span>`
                                    : ""
                            }

                        </div>

                        ${reactionHTML}

                        ${
                            mine && !deleted
                                ? `
                                    <button
                                        style="
                                            position:absolute;
                                            right:-4px;
                                            top:-10px;
                                            width:24px;
                                            height:24px;
                                            border-radius:50%;
                                            background:#18212c;
                                            color:#b6c0cd;
                                            border:1px solid rgba(255,255,255,.08);
                                        "
                                        onclick="messageMenu(event,'${message.id}')">

                                        <i
                                            data-lucide="more-horizontal"
                                            style="width:14px;height:14px">
                                        </i>

                                    </button>
                                  `
                                : ""
                        }

                    </div>

                </div>
            `;

        }).join("");

    lucide.createIcons();

    requestAnimationFrame(() => {

        container.scrollTop =
            container.scrollHeight;

    });

}

/* =========================
   MESSAGE MENU
========================= */

function messageMenu(event, messageId){

    event.stopPropagation();

    document
        .querySelectorAll(".message-menu")
        .forEach(el => el.remove());

    const message =
        currentMessages.find(
            m => m.id === messageId
        );

    if(!message) return;

    const target =
        document.querySelector(
            `[data-message-id="${messageId}"]`
        );

    if(!target) return;

    const menu =
        document.createElement("div");

    menu.className =
        "message-menu";

    menu.innerHTML = `

        <button onclick="editMessage('${messageId}')">
            <i data-lucide="pencil"></i>
            Düzenle
        </button>

        <button onclick="reactMessage('${messageId}','❤️')">
            <i data-lucide="heart"></i>
            Beğen
        </button>

        <button
            class="danger"
            onclick="deleteMessage('${messageId}')">

            <i data-lucide="trash-2"></i>
            Sil

        </button>

    `;

    target.appendChild(menu);

    lucide.createIcons();

    setTimeout(() => {

        document.addEventListener(
            "click",
            function close(e){

                if(!menu.contains(e.target)){
                    menu.remove();

                    document.removeEventListener(
                        "click",
                        close
                    );
                }

            },
            {once:true}
        );

    },0);
}

/* =========================
   SEND
========================= */

function sendMessage(){

    if(!socket || !currentChat){
        showToast(
            "Önce bir sohbet seç."
        );

        return;
    }

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();

    if(!text) return;

    socket.emit(
        "send_message",
        {
            chatId:currentChat.id,
            text
        },
        result => {

            if(!result?.success){

                showToast(
                    result?.error ||
                    "Mesaj gönderilemedi."
                );

                return;
            }

            input.value = "";

            resizeInput();

        }
    );

}

/* =========================
   INCOMING
========================= */

function handleIncomingMessage(message){

    const chat =
        chats.find(
            c => c.id === message.chatId
        );

    if(chat){

        chat.lastMessage = {
            id:message.id,
            text:message.text,
            senderId:message.senderId,
            createdAt:message.createdAt
        };

    }

    if(
        currentChat &&
        currentChat.id === message.chatId
    ){

        const exists =
            currentMessages.some(
                m => m.id === message.id
            );

        if(!exists){

            currentMessages.push(
                message
            );

            renderMessages();

        }

    }

    renderChats();

}

/* =========================
   EDIT
========================= */

function editMessage(messageId){

    const message =
        currentMessages.find(
            m => m.id === messageId
        );

    if(!message) return;

    const newText =
        prompt(
            "Mesajı düzenle:",
            message.text
        );

    if(
        newText === null ||
        !newText.trim()
    ){
        return;
    }

    socket.emit(
        "edit_message",
        {
            messageId,
            text:newText.trim()
        },
        result => {

            if(!result?.success){

                showToast(
                    result?.error ||
                    "Düzenlenemedi."
                );

            }

        }
    );
}

/* =========================
   DELETE
========================= */

function deleteMessage(messageId){

    if(
        !confirm(
            "Bu mesaj silinsin mi?"
        )
    ){
        return;
    }

    socket.emit(
        "delete_message",
        {messageId},
        result => {

            if(!result?.success){

                showToast(
                    result?.error ||
                    "Mesaj silinemedi."
                );

            }

        }
    );
}

/* =========================
   REACTION
========================= */

function reactMessage(
    messageId,
    emoji
){

    socket.emit(
        "react_message",
        {
            messageId,
            emoji
        },
        result => {

            if(!result?.success){

                showToast(
                    result?.error ||
                    "Tepki gönderilemedi."
                );

            }

        }
    );

}

function renderReactions(message){

    if(!message.reactions) return "";

    const entries =
        Object.entries(
            message.reactions
        ).filter(
            ([emoji,list]) =>
                Array.isArray(list) &&
                list.length
        );

    if(!entries.length) return "";

    return `
        <div class="reactions">
            ${entries.map(
                ([emoji,list]) => `
                    <span class="reaction">
                        ${escapeHTML(emoji)}
                        ${list.length}
                    </span>
                `
            ).join("")}
        </div>
    `;
}

/* =========================
   TYPING
========================= */

function handleTyping(){

    resizeInput();

    if(!socket || !currentChat) return;

    socket.emit(
        "typing",
        {
            chatId:currentChat.id,
            typing:true
        }
    );

    clearTimeout(typingTimer);

    typingTimer =
        setTimeout(() => {

            socket.emit(
                "typing",
                {
                    chatId:currentChat.id,
                    typing:false
                }
            );

        },900);
}

/* =========================
   KEYBOARD
========================= */

function handleInputKey(event){

    if(
        event.key === "Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        sendMessage();

    }

}

/* =========================
   AUTO RESIZE
========================= */

function resizeInput(){

    const input =
        document.getElementById(
            "messageInput"
        );

    input.style.height = "44px";

    input.style.height =
        Math.min(
            input.scrollHeight,
            130
        ) + "px";
}

/* =========================
   SEARCH CHATS
========================= */

function filterChats(){

    renderChats();

}

/* =========================
   NEW CHAT
========================= */

function openNewChat(){

    document
        .getElementById(
            "newChatModal"
        )
        .classList.remove("hidden");

    document
        .getElementById(
            "peopleSearch"
        )

}

function closeNewChat(){

}

/* =========================
   SEARCH PEOPLE
========================= */

function searchPeople(){

    clearTimeout(
        searchTimer
    );

    const q =
        document
            .getElementById(
                "peopleSearch"
            )
            .value
            .trim();

    const container =
        document.getElementById(
            "people"
        );

    if(!q){

        container.innerHTML = `
            <div class="empty">
                TRK kodu, kullanıcı adı
                veya isim yaz.
            </div>
        `;

        return;
    }

    container.innerHTML = `
        <div class="empty">
            Aranıyor...
        </div>
    `;

    searchTimer =
        setTimeout(() => {

            socket.emit(
                "search_users",
                {q},
                result => {

                    if(!result?.success){

                        container.innerHTML = `
                            <div class="empty">
                                Kullanıcılar bulunamadı.
                            </div>
                        `;

                        return;
                    }

                    if(!result.users.length){

                        container.innerHTML = `
                            <div class="empty">
                                Kullanıcı bulunamadı.
                            </div>
                        `;

                        return;
                    }

                    container.innerHTML =
                        result.users.map(
                            user => `

                            <div class="person">

                                <div
                                    class="chat-avatar"
                                    style="
                                        width:42px;
                                        height:42px;
                                        flex-basis:42px;
                                    ">

                                    ${escapeHTML(
                                        getInitial(
                                            user.name
                                        )
                                    )}

                                </div>

                                <div class="person-info">

                                    <div class="person-name">
                                        ${escapeHTML(
                                            user.name
                                        )}
                                    </div>

                                    <div class="person-code">
                                        ${escapeHTML(
                                            user.code
                                        )}
                                    </div>

                                </div>

                                <button
                                    class="person-add"
                                    onclick="startChat('${user.id}')">

                                    <i data-lucide="message-circle-plus"></i>

                                </button>

                            </div>

                        `
                        ).join("");

                    lucide.createIcons();

                }
            );

        },250);
}

/* =========================
   START CHAT
========================= */

function startChat(userId){

    socket.emit(
        "create_chat",
        {
            type:"private",
            userId
        },
        result => {

            if(!result?.success){

                showToast(
                    result?.error ||
                    "Sohbet oluşturulamadı."
                );

                return;
            }

            closeNewChat();

            loadChats();

            setTimeout(() => {

                openChat(
                    result.chat.id
                );

            },100);

        }
    );

}

/* =========================
   PROFILE
========================= */

function openProfile(){

    if(!me) return;

    document.getElementById(
        "editName"
    ).value = me.name || "";

    document.getElementById(
        "editBio"
    ).value = me.bio || "";

    document
        .getElementById(
            "profileModal"
        )
        .classList.remove("hidden");

}

function closeProfile(){

    document
        .getElementById(
            "profileModal"
        )
        .classList.add("hidden");

}

function saveProfile(){

    const name =
        document
            .getElementById(
                "editName"
            )
            .value.trim();

    const bio =
        document
            .getElementById(
                "editBio"
            )
            .value.trim();

    fetch(
        "/api/profile",
        {
            method:"PATCH",

            headers:{
                "Content-Type":
                    "application/json",

                Authorization:
                    `Bearer ${token}`
            },

            body:JSON.stringify({
                name,
                bio
            })
        }
    )
    .then(r => r.json())
    .then(data => {

        if(!data.success){

            showToast(
                data.error ||
                "Profil kaydedilemedi."
            );

            return;
        }

        me = data.user;

        updateMyUI();

        closeProfile();

        showToast(
            "Profil güncellendi."
        );

    })
    .catch(() => {

        showToast(
            "Sunucu bağlantı hatası."
        );

    });

}

function showCurrentProfile(){

function copyCurrentCode(){

    const code =

    if(!code){

        );

    }

    copyText(code);

}

/* =========================
   COPY
========================= */

function copyMyCode(){

    if(me?.code){
        copyText(me.code);
    }

}

function copyText(text){

    if(
        navigator.clipboard &&
        window.isSecureContext
    ){

        navigator.clipboard
            .writeText(text)
            .then(() => {

                showToast(
                    "Kopyalandı."
                );

            });

        return;
    }

    const area =
        document.createElement(
            "textarea"
        );

    area.value = text;

    document.body.appendChild(area);

    area.select();

    document.execCommand(
        "copy"
    );

    area.remove();

    showToast(
        "Kopyalandı."
    );

}

/* =========================
   LOGOUT
========================= */

async function logout(){

    try{

        await fetch(
            "/api/logout",
            {
                method:"POST",
                headers:{
                    Authorization:
                        `Bearer ${token}`
                }
            }
        );

    }catch{}

    if(socket){
        socket.disconnect();
        socket = null;
    }

    localStorage.removeItem(
        TOKEN_KEY
    );

    token = null;
    me = null;

    chats = [];
    currentChat = null;
    currentMessages = [];

    document.getElementById(
        "app"
    ).style.display = "none";

    document.getElementById(
        "authScreen"
    ).style.display = "flex";

    document.getElementById(
        "loginIdentifier"
    ).value = "";

    document.getElementById(
        "loginPin"
    ).value = "";

    switchAuth("login");

}

/* =========================
   TOAST
========================= */

let toastTimer = null;

function showToast(text){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent = text;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(() => {

            toast.classList.remove(
                "show"
            );

        },2200);

}

/* =========================
   HELPERS
========================= */

function getInitial(name){

    const value =
        String(name || "?")
            .trim();

    return (
        value.charAt(0)
            .toUpperCase() || "?"
    );

}

function formatTime(timestamp){

    if(!timestamp) return "";

    return new Date(
        timestamp
    ).toLocaleTimeString(
        "tr-TR",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

   GLOBAL CLICK
========================= */

document.addEventListener(

        if(
            !event.target.closest(
                ".message-menu"

            )
        ){

            document
                .querySelectorAll(
                    ".message-menu"
                )
                .forEach(
                    el => el.remove()
                );

        }

    }
);
