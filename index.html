<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>MesajX</title>

<script src="/socket.io/socket.io.js"></script>

<style>
:root{
    --bg:#07090e;
    --panel:#0d1119;
    --panel2:#111722;
    --panel3:#171e2a;
    --line:rgba(255,255,255,.09);
    --text:#f4f7fb;
    --muted:#8994a5;
    --accent:#20c7d6;
    --accent2:#178fa0;
    --danger:#ff5364;
    --success:#36d98b;
    --blue:#438cff;
    --radius:20px;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    overflow:hidden;
}

button,input,textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* AUTH */

#authScreen{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at 20% 10%,rgba(32,199,214,.15),transparent 35%),
        radial-gradient(circle at 80% 90%,rgba(67,140,255,.12),transparent 35%),
        var(--bg);
}

.authBox{
    width:min(440px,100%);
    background:rgba(13,17,25,.88);
    border:1px solid var(--line);
    border-radius:28px;
    padding:30px;
    box-shadow:0 30px 100px rgba(0,0,0,.5);
    backdrop-filter:blur(25px);
}

.logo{
    font-size:34px;
    font-weight:900;
    letter-spacing:-1px;
    margin-bottom:8px;
}

.logo span{
    color:var(--accent);
}

.authSubtitle{
    color:var(--muted);
    font-size:16px;
    margin-bottom:25px;
}

.authTabs{
    display:flex;
    gap:8px;
    background:#080b11;
    padding:5px;
    border-radius:14px;
    margin-bottom:20px;
}

.authTabs button{
    flex:1;
    padding:13px;
    border-radius:10px;
    background:transparent;
    color:var(--muted);
    font-weight:700;
}

.authTabs button.active{
    background:var(--panel3);
    color:var(--text);
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    color:#aab4c4;
    font-size:14px;
    margin-bottom:7px;
}

.field input{
    width:100%;
    padding:15px 16px;
    border:1px solid var(--line);
    border-radius:14px;
    outline:none;
    color:var(--text);
    background:#090d14;
    font-size:16px;
}

.field input:focus{
    border-color:rgba(32,199,214,.7);
}

.primary{
    width:100%;
    padding:15px;
    border-radius:14px;
    background:linear-gradient(135deg,var(--accent),#168c9d);
    color:#001014;
    font-size:16px;
    font-weight:900;
    margin-top:6px;
}

.authError{
    color:#ff7c88;
    min-height:22px;
    font-size:14px;
    margin:8px 0;
}

/* APP */

#app{
    width:100%;
    height:100%;
    display:flex;
}

.sidebar{
    width:360px;
    min-width:360px;
    height:100%;
    border-right:1px solid var(--line);
    background:rgba(10,14,21,.96);
    display:flex;
    flex-direction:column;
}

.sidebarTop{
    padding:18px;
    border-bottom:1px solid var(--line);
}

.brandRow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:17px;
}

.brand{
    font-size:25px;
    font-weight:900;
}

.brand span{
    color:var(--accent);
}

.iconBtn{
    width:43px;
    height:43px;
    border-radius:13px;
    background:var(--panel2);
    border:1px solid var(--line);
    color:var(--text);
    font-size:20px;
}

.search{
    display:flex;
    align-items:center;
    gap:10px;
    background:#080c13;
    border:1px solid var(--line);
    border-radius:14px;
    padding:0 13px;
}

.search input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    color:var(--text);
    padding:14px 0;
    font-size:16px;
}

.searchIcon{
    color:var(--muted);
}

.chatList{
    flex:1;
    overflow:auto;
    padding:10px;
}

.chatItem{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px;
    background:transparent;
    color:var(--text);
    text-align:left;
    border-radius:16px;
    margin-bottom:4px;
}

.chatItem:hover,
.chatItem.active{
    background:var(--panel2);
}

.avatar{
    width:49px;
    height:49px;
    min-width:49px;
    border-radius:50%;
    background:linear-gradient(135deg,#20c7d6,#356cff);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-weight:900;
    font-size:18px;
    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.chatInfo{
    min-width:0;
    flex:1;
}

.chatName{
    font-size:16px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chatLast{
    color:var(--muted);
    font-size:14px;
    margin-top:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.profileMini{
    padding:12px;
    border-top:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:11px;
}

.profileMiniInfo{
    flex:1;
    min-width:0;
}

.profileMiniName{
    font-weight:800;
    font-size:15px;
}

.profileMiniCode{
    color:var(--muted);
    font-size:12px;
    margin-top:3px;
}

/* CHAT */

.chat{
    flex:1;
    min-width:0;
    height:100%;
    display:flex;
    flex-direction:column;
    background:
        radial-gradient(circle at 50% -20%,rgba(32,199,214,.08),transparent 35%),
        #080b11;
}

.emptyChat{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:var(--muted);
    text-align:center;
    padding:30px;
}

.emptyIcon{
    font-size:52px;
    margin-bottom:15px;
}

.emptyChat h2{
    color:var(--text);
    margin:0 0 8px;
    font-size:25px;
}

.chatHeader{
    height:76px;
    min-height:76px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 18px;
    background:rgba(10,14,21,.86);
    backdrop-filter:blur(18px);
}

.backBtn{
    display:none;
}

.headerInfo{
    flex:1;
    min-width:0;
}

.headerName{
    font-size:18px;
    font-weight:900;
}

.headerStatus{
    color:var(--muted);
    font-size:13px;
    margin-top:3px;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:22px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.messageRow{
    display:flex;
    width:100%;
}

.messageRow.mine{
    justify-content:flex-end;
}

.bubble{
    max-width:min(72%,620px);
    padding:11px 14px;
    border-radius:17px;
    background:#151b25;
    border:1px solid rgba(255,255,255,.055);
    box-shadow:0 6px 20px rgba(0,0,0,.13);
}

.mine .bubble{
    background:linear-gradient(135deg,#116a77,#168c9d);
}

.messageText{
    font-size:16px;
    line-height:1.48;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.messageMeta{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:5px;
    margin-top:5px;
    color:rgba(255,255,255,.55);
    font-size:11px;
}

.read{
    color:#74d7ff;
}

.reactions{
    display:flex;
    gap:4px;
    margin-top:5px;
    flex-wrap:wrap;
}

.reaction{
    padding:3px 7px;
    background:rgba(0,0,0,.28);
    border-radius:10px;
    font-size:13px;
}

.composer{
    padding:12px 16px 16px;
    border-top:1px solid var(--line);
    background:rgba(8,11,17,.96);
}

.composerInner{
    display:flex;
    align-items:flex-end;
    gap:8px;
    max-width:1100px;
    margin:auto;
}

.messageInput{
    flex:1;
    resize:none;
    min-height:48px;
    max-height:140px;
    border:1px solid var(--line);
    border-radius:17px;
    padding:13px 15px;
    outline:none;
    color:var(--text);
    background:var(--panel2);
    font-size:16px;
    line-height:1.4;
}

.sendBtn{
    width:50px;
    height:50px;
    min-width:50px;
    border-radius:16px;
    background:var(--accent);
    color:#001014;
    font-size:20px;
    font-weight:900;
}

/* EMOJI */

.emojiPanel{
    position:absolute;
    bottom:80px;
    right:16px;
    width:min(360px,calc(100vw - 30px));
    max-height:360px;
    overflow:auto;
    background:#101620;
    border:1px solid var(--line);
    border-radius:20px;
    padding:12px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
    z-index:50;
}

.emojiTabs{
    display:flex;
    gap:6px;
    margin-bottom:10px;
    overflow:auto;
}

.emojiTabs button{
    padding:8px 10px;
    border-radius:10px;
    background:var(--panel2);
    color:#fff;
}

.emojiGrid{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:3px;
}

.emojiGrid button{
    background:transparent;
    font-size:25px;
    padding:7px 3px;
    border-radius:10px;
}

.emojiGrid button:hover{
    background:var(--panel3);
}

/* MODAL */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.68);
    backdrop-filter:blur(7px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    z-index:100;
}

.modal{
    width:min(500px,100%);
    max-height:90vh;
    overflow:auto;
    background:#101620;
    border:1px solid var(--line);
    border-radius:24px;
    padding:22px;
    box-shadow:0 30px 100px rgba(0,0,0,.55);
}

.modal h2{
    margin:0 0 18px;
    font-size:22px;
}

.modalTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.resultItem{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    border-radius:14px;
    background:transparent;
    color:#fff;
    text-align:left;
}

.resultItem:hover{
    background:var(--panel2);
}

.resultInfo{
    flex:1;
}

.resultName{
    font-size:16px;
    font-weight:800;
}

.resultCode{
    color:var(--muted);
    font-size:13px;
    margin-top:3px;
}

.modalActions{
    display:flex;
    gap:8px;
    margin-top:18px;
}

.secondary{
    flex:1;
    padding:13px;
    border-radius:13px;
    background:var(--panel3);
    color:#fff;
}

.danger{
    background:rgba(255,83,100,.12);
    color:#ff7c88;
}

/* CALL */

.callScreen{
    position:fixed;
    inset:0;
    z-index:200;
    background:#030509;
    display:flex;
    flex-direction:column;
}

.remoteVideo{
    width:100%;
    height:100%;
    object-fit:cover;
    background:#05070b;
}

.localVideo{
    position:absolute;
    right:16px;
    top:16px;
    width:125px;
    height:175px;
    object-fit:cover;
    border-radius:17px;
    border:2px solid rgba(255,255,255,.2);
    background:#111;
}

.callTop{
    position:absolute;
    top:18px;
    left:18px;
    right:18px;
    display:flex;
    justify-content:space-between;
    z-index:2;
}

.callName{
    background:rgba(0,0,0,.5);
    backdrop-filter:blur(12px);
    padding:10px 14px;
    border-radius:12px;
    font-weight:800;
}

.callControls{
    position:absolute;
    bottom:35px;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    gap:12px;
    z-index:3;
}

.callButton{
    width:56px;
    height:56px;
    border-radius:50%;
    background:#1b2430;
    color:#fff;
    font-size:21px;
}

.callButton.end{
    background:#ff4f61;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(20px);
    background:#151c27;
    color:#fff;
    border:1px solid var(--line);
    border-radius:13px;
    padding:12px 16px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:500;
    font-size:14px;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* MOBILE */

@media(max-width:760px){

    .sidebar{
        width:100%;
        min-width:100%;
    }

    .chat{
        position:fixed;
        inset:0;
        z-index:10;
        transform:translateX(100%);
        transition:.25s;
    }

    body.chatOpen .chat{
        transform:translateX(0);
    }

    .backBtn{
        display:block;
    }

    .bubble{
        max-width:84%;
    }

    .messages{
        padding:15px 12px;
    }

    .composer{
        padding-bottom:max(12px,env(safe-area-inset-bottom));
    }

    .emojiPanel{
        bottom:76px;
    }
}
</style>
</head>

<body>

<!-- AUTH -->

<section id="authScreen">

    <div class="authBox">

        <div class="logo">
            Mesaj<span>X</span>
        </div>

        <div class="authSubtitle">
            Özel mesajlaşmanın daha modern hali.
        </div>

        <div class="authTabs">
            <button id="loginTab" class="active">
                Giriş
            </button>

            <button id="registerTab">
                Hesap oluştur
            </button>
        </div>

        <div id="loginForm">

            <div class="field">
                <label>Kullanıcı adı veya TRK kodu</label>
                <input
                    id="loginIdentifier"
                    autocomplete="username"
                    placeholder="ör. TRK-8F42K1"
                >
            </div>

            <div class="field">
                <label>PIN</label>
                <input
                    id="loginPin"
                    type="password"
                    inputmode="numeric"
                    maxlength="8"
                    placeholder="PIN"
                >
            </div>

            <div id="loginError" class="authError"></div>

            <button id="loginButton" class="primary">
                Giriş yap
            </button>

        </div>

        <div id="registerForm" class="hidden">

            <div class="field">
                <label>Adın</label>
                <input
                    id="registerName"
                    autocomplete="name"
                    placeholder="Adın"
                >
            </div>

            <div class="field">
                <label>Kullanıcı adı</label>
                <input
                    id="registerUsername"
                    autocomplete="username"
                    placeholder="kullaniciadi"
                >
            </div>

            <div class="field">
                <label>PIN</label>
                <input
                    id="registerPin"
                    type="password"
                    inputmode="numeric"
                    maxlength="8"
                    placeholder="4-8 rakam"
                >
            </div>

            <div id="registerError" class="authError"></div>

            <button id="registerButton" class="primary">
                Hesap oluştur
            </button>

        </div>

    </div>

</section>


<!-- APP -->

<section id="app" class="hidden">

    <aside class="sidebar">

        <div class="sidebarTop">

            <div class="brandRow">

                <div class="brand">
                    Mesaj<span>X</span>
                </div>

                <div>
                    <button
                        class="iconBtn"
                        id="newChatButton"
                        title="Yeni sohbet"
                    >＋</button>

                    <button
                        class="iconBtn"
                        id="profileButton"
                        title="Profil"
                    >●</button>
                </div>

            </div>

            <div class="search">

                <span class="searchIcon">⌕</span>

                <input
                    id="globalSearch"
                    placeholder="Kişi, kullanıcı adı veya TRK kodu ara..."
                >

            </div>

        </div>

        <div id="chatList" class="chatList"></div>

        <div class="profileMini">

            <div id="miniAvatar" class="avatar">
                ?
            </div>

            <div class="profileMiniInfo">

                <div
                    id="miniName"
                    class="profileMiniName"
                >...</div>

                <div
                    id="miniCode"
                    class="profileMiniCode"
                >...</div>

            </div>

            <button
                id="logoutButton"
                class="iconBtn"
                title="Çıkış"
            >↪</button>

        </div>

    </aside>


    <main class="chat">

        <div id="emptyChat" class="emptyChat">

            <div class="emptyIcon">💬</div>

            <h2>MesajX</h2>

            <div>
                Bir kişiyi arayarak özel sohbet başlat.
            </div>

        </div>


        <div
            id="chatContent"
            class="hidden"
            style="height:100%;display:flex;flex-direction:column"
        >

            <header class="chatHeader">

                <button
                    id="backButton"
                    class="iconBtn backBtn"
                >‹</button>

                <div id="chatAvatar" class="avatar">
                    ?
                </div>

                <div class="headerInfo">

                    <div
                        id="chatName"
                        class="headerName"
                    >Sohbet</div>

                    <div
                        id="chatStatus"
                        class="headerStatus"
                    ></div>

                </div>

                <button
                    id="audioCallButton"
                    class="iconBtn"
                    title="Sesli arama"
                >☎</button>

                <button
                    id="videoCallButton"
                    class="iconBtn"
                    title="Görüntülü arama"
                >▣</button>

                <button
                    id="chatMenuButton"
                    class="iconBtn"
                >⋮</button>

            </header>


            <div id="messages" class="messages"></div>


            <div class="composer">

                <div class="composerInner">

                    <button
                        id="emojiButton"
                        class="iconBtn"
                        title="Emoji"
                    >☺</button>

                    <textarea
                        id="messageInput"
                        class="messageInput"
                        rows="1"
                        placeholder="Mesaj yaz..."
                    ></textarea>

                    <button
                        id="sendButton"
                        class="sendBtn"
                    >➤</button>

                </div>

            </div>

        </div>

    </main>

</section>


<!-- EMOJI -->

<div
    id="emojiPanel"
    class="emojiPanel hidden"
>

    <div class="emojiTabs">

        <button data-cat="faces">😀</button>
        <button data-cat="hands">👍</button>
        <button data-cat="hearts">❤️</button>
        <button data-cat="objects">🔥</button>
        <button data-cat="animals">🐱</button>

    </div>

    <div
        id="emojiGrid"
        class="emojiGrid"
    ></div>

</div>


<!-- NEW CHAT -->

<div
    id="newChatModal"
    class="overlay hidden"
>

    <div class="modal">

        <div class="modalTop">

            <h2>Yeni sohbet</h2>

            <button
                class="iconBtn"
                data-close="newChatModal"
            >×</button>

        </div>

        <div class="search">

            <span>⌕</span>

            <input
                id="personSearch"
                placeholder="TRK kodu veya kullanıcı adı..."
            >

        </div>

        <div
            id="searchResults"
            style="margin-top:12px"
        ></div>

    </div>

</div>


<!-- PROFILE -->

<div
    id="profileModal"
    class="overlay hidden"
>

    <div class="modal">

        <div class="modalTop">

            <h2>Profil</h2>

            <button
                class="iconBtn"
                data-close="profileModal"
            >×</button>

        </div>

        <div style="display:flex;justify-content:center;margin:10px 0 20px">

            <div
                id="profileAvatar"
                class="avatar"
                style="width:90px;height:90px;font-size:30px"
            >?</div>

        </div>

        <div class="field">
            <label>Ad</label>
            <input id="profileName">
        </div>

        <div class="field">
            <label>Biyografi</label>
            <input id="profileBio">
        </div>

        <div class="field">
            <label>Senin TRK kodun</label>
            <input
                id="profileCode"
                readonly
            >
        </div>

        <button
            id="saveProfileButton"
            class="primary"
        >
            Kaydet
        </button>

    </div>

</div>


<!-- CHAT MENU -->

<div
    id="chatMenuModal"
    class="overlay hidden"
>

    <div class="modal">

        <div class="modalTop">

            <h2>Sohbet seçenekleri</h2>

            <button
                class="iconBtn"
                data-close="chatMenuModal"
            >×</button>

        </div>

        <button
            id="blockButton"
            class="secondary danger"
        >
            Kullanıcıyı engelle
        </button>

    </div>

</div>


<!-- CALL -->

<div
    id="callScreen"
    class="callScreen hidden"
>

    <video
        id="remoteVideo"
        class="remoteVideo"
        autoplay
        playsinline
    ></video>

    <video
        id="localVideo"
        class="localVideo"
        autoplay
        muted
        playsinline
    ></video>

    <div class="callTop">

        <div
            id="callName"
            class="callName"
        >Arama</div>

    </div>

"use strict";

    localStorage.getItem("mesajx_token") || "";

/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
    document.getElementById(id);

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function initial(name){

    const text =
        String(name || "?").trim();

    return text
        ? text.charAt(0).toUpperCase()
        : "?";
}

function formatTime(date){

    const d =
        new Date(date);

    return d.toLocaleTimeString(
        "tr-TR",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}

function toast(text){

    const el = $("toast");

    el.textContent = text;

    el.classList.add("show");

    clearTimeout(
        toast.timer
    );

    toast.timer =
        setTimeout(
            () =>
                el.classList.remove("show"),
            2500
        );
}

function avatarHTML(user){

    if(
        user &&
        user.avatar
    ){
        return `
            <img
                src="${escapeHTML(user.avatar)}"
                alt=""
            >
        `;
    }

    return escapeHTML(
        initial(
            user?.name
        )
    );
}


/* =========================================================
   API
========================================================= */

async function api(
    url,
    options={}
){

    const headers = {
        "Content-Type":
            "application/json",
        ...(options.headers || {})
    };

    if(token){
        headers.Authorization =
            `Bearer ${token}`;
    }

    const response =
        await fetch(
            url,
            {
                ...options,
                headers
            }
        );

    let data = {};

    try{
        data =
            await response.json();
    }catch{}

    if(
        response.status === 401
    ){
        logoutLocal();
    }

    if(!response.ok){
        throw new Error(
            data.error ||
            "İşlem başarısız."
        );
    }

    return data;
}


/* =========================================================
   AUTH UI
========================================================= */

        .classList.remove("active");

        .classList.remove("active");

    $("registerForm")
        .classList.remove("hidden");

    $("loginForm")

/* =========================================================

========================================================= */

$("loginButton").onclick =
async () => {

    const identifier =
        $("loginIdentifier")
            .value.trim();

    const pin =
        $("loginPin")
            .value.trim();

    $("loginError")

            data.token ||

/* =========================================================
   BOOT
   Giriş bir kere yapılınca token saklanır.
========================================================= */

async function boot(){

    if(!token){
        return;
    }

    try{

        const data =
            await api(
                "/api/me"
            );

        me = data.user;

        enterApp();

    }catch{

        localStorage.removeItem(
            "mesajx_token"
        );

        token = "";

}

function enterApp(){

    $("authScreen")
        .classList.add("hidden");

    $("app")
        .classList.remove("hidden");

    updateMiniProfile();

    authenticateSocket();

    loadChats();
}

function logoutLocal(){

    token = "";
    me = null;

    localStorage.removeItem(
        "mesajx_token"
    );

    location.reload();
}

$("logoutButton").onclick =
async () => {

    try{

};


/* =========================================================

========================================================= */

function authenticateSocket(){

    socket.emit(
        "authenticate",
        { token },
        result => {

            if(!result?.success){

                toast(
                    "Sunucu oturumu doğrulayamadı."
                );

                return;
            }

            me = result.user;

            updateMiniProfile();

            loadChats();

/* =========================================================
   CHAT LIST
========================================================= */

function loadChats(){

    socket.emit(
        "get_chats",
        result => {

            if(!result?.success){
                return;
            }

            chats =
                result.chats || [];

            renderChats();
        }
    );
}

function renderChats(){

    const list =
        $("chatList");

    if(!chats.length){

        list.innerHTML = `
            <div style="
                color:#8994a5;
                text-align:center;
                padding:35px 15px;
                font-size:15px;
            ">
                Henüz sohbet yok.<br><br>
                ＋ ile yeni sohbet başlat.
            </div>
        `;

        return;
    }

    list.innerHTML =
        chats.map(chat => {

            const user =
                chat.type === "private"
                    ? chat.otherUser
                    : null;

            const name =
                chat.type === "private"
                    ? user?.name ||
                      "Kullanıcı"
                    : chat.name ||
                      "Grup";

            const last =
                chat.lastMessage;

            const text =
                last
                    ? last.senderId === me.id
                        ? "Sen: " +
                          last.text
                        : last.text
                    : "Yeni sohbet";

            return `
                <button
                    class="chatItem ${
                        activeChat?.id === chat.id
                            ? "active"
                            : ""
                    }"
                    data-chat-id="${escapeHTML(chat.id)}"
                >

                    <div class="avatar">
                        ${
                            user
                                ? avatarHTML(user)
                                : "👥"
                        }
                    </div>

                    <div class="chatInfo">

                        <div class="chatName">
                            ${escapeHTML(name)}
                        </div>

                        <div class="chatLast">
                            ${escapeHTML(text)}
                        </div>

                    </div>

                </button>
            `;
        }).join("");

    list
        .querySelectorAll(".chatItem")
        .forEach(button => {

            button.onclick = () => {

                const chat =
                    chats.find(
                        x =>
                            x.id ===
                            button.dataset.chatId
                    );

                openChat(chat);
            };
        });
}


/* =========================================================
   OPEN CHAT
========================================================= */

function openChat(chat){

    if(!chat) return;

    activeChat = chat;

    document.body
        .classList.add("chatOpen");

    $("emptyChat")
        .classList.add("hidden");

    $("chatContent")
        .classList.remove("hidden");

    const user =
        chat.type === "private"
            ? chat.otherUser
            : null;

    $("chatName")
        .textContent =
        chat.type === "private"
            ? user?.name || "Kullanıcı"
            : chat.name || "Grup";

    $("chatAvatar")
        .innerHTML =
        user
            ? avatarHTML(user)
            : "👥";

    updateOnlineStatus();

    renderChats();

    loadMessages();

    $("messageInput")
        .focus();
}

$("backButton").onclick = () => {

    document.body
        .classList.remove("chatOpen");

    activeChat = null;
};


/* =========================================================
   ONLINE STATUS
========================================================= */

function updateOnlineStatus(){

    if(!activeChat){
        return;
    }

    const user =
        activeChat.otherUser;

    if(!user){
        $("chatStatus")
            .textContent =
            "Grup sohbeti";

        return;
    }

    $("chatStatus")
        .textContent =
        user.online
            ? "çevrimiçi"
            : "son görülme bilgisi mevcut";
}


/* =========================================================
   MESSAGES
========================================================= */

function loadMessages(){

    if(!activeChat) return;

    socket.emit(
        "get_messages",
        {
            chatId:
                activeChat.id
        },
        result => {

            if(!result?.success){
                toast(
                    result?.error ||
                    "Mesajlar alınamadı."
                );

                return;
            }

            messages =
                result.messages || [];

            renderMessages();

            markRead();
        }
    );
}

function renderMessages(){

    const box =
        $("messages");

    if(!messages.length){

        box.innerHTML = `
            <div style="
                margin:auto;
                color:#8994a5;
                text-align:center;
                font-size:15px;
            ">
                Henüz mesaj yok.<br>
                İlk mesajı sen gönder.
            </div>
        `;

        return;
    }

    box.innerHTML =
        messages.map(message => {

            const mine =
                message.senderId ===
                me.id;

            let status = "";

            if(mine){

                if(
                    Array.isArray(
                        message.readBy
                    ) &&
                    message.readBy.length
                ){
                    status =
                        `<span class="read">✓✓</span>`;
                }
                else if(
                    message.status ===
                    "delivered"
                ){
                    status = "✓✓";
                }
                else{
                    status = "✓";
                }
            }

            let reactionHTML = "";

            const reactions =
                message.reactions ||
                {};

            const reactionEntries =
                Object.entries(
                    reactions
                );

            if(
                reactionEntries.length
            ){

                reactionHTML =
                    `
                    <div class="reactions">
                        ${
                            reactionEntries
                                .map(
                                    ([emoji,users]) =>
                                        `
                                        <span
                                            class="reaction"
                                            title="${users.length} tepki"
                                        >
                                            ${emoji}
                                            ${users.length}
                                        </span>
                                        `
                                )
                                .join("")
                        }
                    </div>
                    `;
            }

            return `
                <div
                    class="messageRow ${
                        mine
                            ? "mine"
                            : ""
                    }"
                    data-message-id="${
                        escapeHTML(
                            message.id
                        )
                    }"
                >

                    <div
                        class="bubble"
                        data-react-message="${
                            escapeHTML(
                                message.id
                            )
                        }"
                    >

                        <div class="messageText">
                            ${
                                escapeHTML(
                                    message.text
                                )
                            }
                        </div>

                        ${reactionHTML}

                        <div class="messageMeta">

                            ${
                                message.edited
                                    ? "düzenlendi · "
                                    : ""
                            }

                            ${
                                formatTime(
                                    message.createdAt
                                )
                            }

                            ${
                                mine
                                    ? " " + status
                                    : ""
                            }

                        </div>

                    </div>

                </div>
            `;
        }).join("");

    box.scrollTop =
        box.scrollHeight;

    box.querySelectorAll(
        "[data-react-message]"
    ).forEach(el => {

        let timer;

        el.addEventListener(
            "contextmenu",
            event => {

                event.preventDefault();

                openReactionPicker(
                    event,
                    el.dataset.reactMessage
                );
            }
        );

        el.addEventListener(
            "dblclick",
            () => {

                quickReact(
                    el.dataset.reactMessage,
                    "❤️"
                );
            }
        );
    });
}


/* =========================================================
   READ RECEIPT
========================================================= */

function markRead(){

    if(!activeChat){
        return;
    }

    socket.emit(
        "read_receipt",
        {
            chatId:
                activeChat.id
        }
    );
}


/* =========================================================
   SEND
========================================================= */

function sendMessage(){

    if(!activeChat){
        return;
    }

    const input =
        $("messageInput");

    const text =
        input.value.trim();

    if(!text){
        return;
    }

    socket.emit(
        "send_message",
        {
            chatId:
                activeChat.id,
            text
        },
        result => {

            if(!result?.success){

                toast(
                    result?.error ||
                    "Mesaj gönderilemedi."
                );

                return;
            }

            input.value = "";

            resizeTextarea();

            if(
                result.message
            ){
                messages.push(
                    result.message
                );

                renderMessages();
            }

            loadChats();
        }
    );
}

$("sendButton").onclick =
sendMessage;

$("messageInput").addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();
        }
    }
);

$("messageInput").addEventListener(
    "input",
    () => {

        resizeTextarea();

        if(!activeChat){
            return;
        }

        socket.emit(
            "typing",
            {
                chatId:
                    activeChat.id,
                typing:true
            }
        );

        clearTimeout(
            typingTimer
        );

        typingTimer =
            setTimeout(
                () => {

                    socket.emit(
                        "typing",
                        {
                            chatId:
                                activeChat.id,
                            typing:false
                        }
                    );

                },
                800
            );
    }
);

function resizeTextarea(){

    const input =
        $("messageInput");

    input.style.height =
        "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            140

}

function insertEmoji(emoji){

    const input =
        $("messageInput");

    const start =
        input.selectionStart;

    const end =
        input.selectionEnd;

    input.value =
        input.value.slice(
            0,
            start

        emoji +
        input.value.slice(
            end
        );

    input.focus();

    const pos =
        start +
        emoji.length;

    input.setSelectionRange(
        pos,
        pos
    );

    resizeTextarea();
}

function quickReact(
    messageId,
    emoji
){

    socket.emit(
        "react_message",
        {
            messageId,
            emoji
        },
        result => {

            if(
                !result?.success
            ){
                toast(
                    result?.error ||
                    "Tepki gönderilemedi."
                );
            }
        }
    );
}

function openReactionPicker(
    event,
    messageId
){

    const choices = [
        "❤️",
        "😂",
        "👍",
        "🔥",
        "😮",
        "😢",
        "👏",
        "🎉"
    ];

    const old =
        document.querySelector(
            ".reactionPicker"
        );

    if(old){
        old.remove();
    }

    const picker =
        document.createElement(
            "div"
        );

    picker.className =
        "reactionPicker";

    picker.style.position =
        "fixed";

    picker.style.left =
        Math.min(
            event.clientX,
            window.innerWidth - 250
        ) + "px";

    picker.style.top =
        Math.min(
            event.clientY,
            window.innerHeight - 70
        ) + "px";

    picker.style.zIndex =
        "500";

    picker.style.background =
        "#111722";

    picker.style.border =
        "1px solid rgba(255,255,255,.1)";

    picker.style.borderRadius =
        "15px";

    picker.style.padding =
        "7px";

    picker.style.display =
        "flex";

    picker.style.gap =
        "3px";

    picker.style.boxShadow =
        "0 20px 50px rgba(0,0,0,.5)";

    picker.innerHTML =
        choices.map(
            emoji =>
                `
                <button
                    style="
                        background:transparent;
                        color:white;
                        border:0;
                        font-size:23px;
                        padding:7px;
                        border-radius:9px;
                    "
                    data-reaction="${emoji}"
                >
                    ${emoji}
                </button>
                `
        ).join("");

    document.body.appendChild(
        picker
    );

    picker.querySelectorAll(
        "[data-reaction]"
    ).forEach(button => {

        button.onclick = () => {

            quickReact(
                messageId,
                button.dataset.reaction
            );

            picker.remove();
        };
    });

    setTimeout(
        () => {

            document.addEventListener(
                "click",
                function close(e){

                    if(
                        !picker.contains(e.target)
                    ){
                        picker.remove();

                        document.removeEventListener(
                            "click",
                            close
                        );
                    }
                },
                {once:true}
            );

        },
        0
    );
}


/* =========================================================
   SEARCH
========================================================= */

$("newChatButton").onclick =
() => {

    $("newChatModal")
        .classList.remove(
            "hidden"
        );

    $("personSearch")

};

let searchTimer;

$("globalSearch").addEventListener(
    "input",
    () => {

        );

$("personSearch").addEventListener(
    "input",

function searchPeople(
    q,
    container
){

    if(!q){

        container.innerHTML = "";

        return;
    }

    socket.emit(
        "search_users",
        {q},
        result => {

            if(
                !result?.success
            ){
                return;
            }

            const users =
                result.users || [];

            if(!users.length){

                container.innerHTML = `
                    <div style="
                        color:#8994a5;
                        padding:18px;
                        text-align:center;
                    ">
                        Kullanıcı bulunamadı.
                    </div>
                `;

                return;
            }

            container.innerHTML =
                users.map(
                    user =>
                        `
                        <button
                            class="resultItem"
                            data-user-id="${escapeHTML(user.id)}"
                        >

                            <div class="avatar">
                                ${avatarHTML(user)}
                            </div>

                            <div class="resultInfo">

                                <div class="resultName">
                                    ${escapeHTML(user.name)}
                                </div>

                                <div class="resultCode">
                                    @${escapeHTML(user.username)}
                                    ·
                                    ${escapeHTML(user.code)}
                                </div>

                            </div>

                        </button>
                        `
                ).join("");

            container
                .querySelectorAll(
                    "[data-user-id]"
                )
                .forEach(button => {

                    button.onclick = () => {

                        const user =
                            users.find(
                                x =>
                                    x.id ===
                                    button.dataset.userId
                            );

                        startPrivateChat(
                            user
                        );
                    };
                });
        }
    );
}

function startPrivateChat(
    user
){

    if(!user) return;

    socket.emit(
        "create_chat",
        {
            type:"private",
            members:[
                me.id,
                user.id
            ]
        },
        result => {

            if(!result?.success){

                toast(
                    result?.error ||
                    "Sohbet açılamadı."
                );

                return;
            }

            $("newChatModal")
                .classList.add(
                    "hidden"
                );

            $("personSearch")
                .value = "";

            const chat =
                result.chat;

            chat.otherUser =
                user;

            if(
                !chats.some(
                    x =>
                        x.id ===
                        chat.id
                )
            ){
                chats.unshift(
                    chat
                );
            }

            openChat(chat);
        }
    );
}

/* =========================================================
   SOCKET EVENTS
========================================================= */

socket.on(
    "new_message",
    ({message}) => {

        if(
            activeChat &&
            message.chatId ===
            activeChat.id
        ){

            const exists =
                messages.some(
                    x =>
                        x.id ===
                        message.id
                );

            if(!exists){

                messages.push(
                    message
                );

                renderMessages();

                markRead();
            }
        }

        loadChats();
    }
);

socket.on(
    "message_delivered",
    ({messageId}) => {

        const message =
            messages.find(
                x =>
                    x.id ===
                    messageId
            );

        if(message){

            message.status =
                "delivered";

            renderMessages();
        }
    }
);

socket.on(
    "read_receipt",
    data => {

        if(
            !activeChat ||
            data.chatId !==
            activeChat.id
        ){
            return;
        }

        const ids =
            data.messageIds || [];

        messages.forEach(
            message => {

                if(
                    ids.includes(
                        message.id
                    )
                ){

                    if(
                        !Array.isArray(
                            message.readBy
                        )
                    ){
                        message.readBy = [];
                    }

                    if(
                        !message.readBy.includes(
                            data.userId
                        )
                    ){
                        message.readBy.push(
                            data.userId
                        );
                    }

                    message.status =
                        "read";
                }
            }
        );

        renderMessages();

        loadChats();
    }
);

socket.on(
    "message_reaction",
    ({message}) => {

        const index =
            messages.findIndex(
                x =>
                    x.id ===
                    message.id
            );

        if(index !== -1){

            messages[index] =
                message;

            renderMessages();
        }

        loadChats();
    }
);

socket.on(
    "message_edited",
    ({message}) => {

        const index =
            messages.findIndex(
                x =>
                    x.id ===
                    message.id
            );

        if(index !== -1){

            messages[index] =
                message;

            renderMessages();
        }
    }
);

socket.on(
    "message_deleted",
    ({messageId}) => {

        const message =
            messages.find(
                x =>
                    x.id ===
                    messageId
            );

        if(message){

            message.deleted =
                true;

            message.text =
                "Bu mesaj silindi.";

            renderMessages();
        }

        loadChats();
    }
);

socket.on(
    "chat_created",
    ({chat}) => {

        if(
            !chats.some(
                x =>
                    x.id ===
                    chat.id
            )
        ){

            chats.unshift(
                chat
            );

            loadChats();
        }
    }
);

socket.on(
    "typing",
    data => {

        if(
            !activeChat ||
            data.chatId !==
            activeChat.id
        ){
            return;
        }

        if(
            data.typing
        ){

            $("chatStatus")
                .textContent =
                "yazıyor...";

        }else{

            updateOnlineStatus();
        }
    }
);

socket.on(
    "user_block_changed",
    () => {

        loadChats();
    }
);


/* =========================================================
   REAL WEBRTC CALL
========================================================= */

async function startCall(
    type
){

    if(
        !activeChat ||
        !activeChat.otherUser
    ){
        return;
    }

    currentCallUserId =
        activeChat.otherUser.id;

    currentCallType =
        type;

    try{

        localStream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio:true,
                    video:
                        type ===
                        "video"
                });

        $("localVideo")
            .srcObject =
            localStream;

        $("localVideo")
            .classList.toggle(
                "hidden",
                type !== "video"
            );

        $("callName")
            .textContent =
            activeChat.otherUser.name;

        $("callScreen")
            .classList.remove(
                "hidden"
            );

        createPeer();

        localStream
            .getTracks()
            .forEach(
                track =>
                    peer.addTrack(
                        track,
                        localStream
                    )
            );

        const offer =
            await peer.createOffer();

        await peer.setLocalDescription(
            offer
        );

        socket.emit(
            "call_user",
            {
                targetId:
                    currentCallUserId,
                callType:type,
                offer
            }
        );

    }catch(error){

        console.error(error);

        toast(
            "Mikrofon/kamera erişimi verilemedi."
        );

        endCall(false);
    }
}

function createPeer(){

    peer =
        new RTCPeerConnection({

            iceServers:[
                {
                    urls:
                        "stun:stun.l.google.com:19302"
                },
                {
                    urls:
                        "stun:stun1.l.google.com:19302"
                }
            ]
        });

    peer.onicecandidate =
        event => {

            if(
                event.candidate &&
                currentCallUserId
            ){

                socket.emit(
                    "call_ice_candidate",
                    {
                        targetId:
                            currentCallUserId,
                        candidate:
                            event.candidate
                    }
                );
            }
        };

    peer.ontrack =
        event => {

            $("remoteVideo")
                .srcObject =
                event.streams[0];
        };

    peer.onconnectionstatechange =
        () => {

            if(
                peer &&
                (
                    peer.connectionState ===
                    "failed" ||
                    peer.connectionState ===
                    "disconnected" ||
                    peer.connectionState ===
                    "closed"
                )
            ){
                endCall(false);
            }
        };
}

socket.on(
    "incoming_call",
    async data => {

        currentCallUserId =
            data.from;

        currentCallType =
            data.callType;

        const caller =
            loadUserById(
                data.from
            );

        $("callName")
            .textContent =
            caller?.name ||
            "Gelen arama";

        const accept =
            confirm(
                `${
                    caller?.name ||
                    "Bir kullanıcı"
                } seni ${
                    data.callType ===
                    "video"
                        ? "görüntülü"
                        : "sesli"
                } arıyor. Kabul edilsin mi?`
            );

        if(!accept){

            socket.emit(
                "call_reject",
                {
                    targetId:
                        data.from
                }
            );

            return;
        }

        try{

            localStream =
                await navigator.mediaDevices
                    .getUserMedia({
                        audio:true,
                        video:
                            data.callType ===
                            "video"
                    });

            $("localVideo")
                .srcObject =
                localStream;

            $("localVideo")
                .classList.toggle(
                    "hidden",
                    data.callType !==
                    "video"
                );

            $("callScreen")
                .classList.remove(
                    "hidden"
                );

            createPeer();

            localStream
                .getTracks()
                .forEach(
                    track =>
                        peer.addTrack(
                            track,
                            localStream
                        )
                );

            await peer.setRemoteDescription(
                new RTCSessionDescription(
                    data.offer
                )
            );

            const answer =
                await peer.createAnswer();

            await peer.setLocalDescription(
                answer
            );

            socket.emit(
                "call_accept",
                {
                    targetId:
                        data.from,
                    answer
                }
            );

        }catch(error){

            console.error(error);

            toast(
                "Arama başlatılamadı."
            );
        }
    }
);

socket.on(
    "call_accepted",
    async data => {

        if(
            !peer ||
            !data.answer
        ){
            return;
        }

        await peer.setRemoteDescription(
            new RTCSessionDescription(
                data.answer
            )
        );
    }
);

socket.on(
    "call_ice_candidate",
    async data => {

        if(
            !peer ||
            !data.candidate
        ){
            return;
        }

        try{

            await peer.addIceCandidate(
                new RTCIceCandidate(
                    data.candidate
                )
            );

        }catch(error){

            console.error(
                "ICE error:",
                error
            );
        }
    }
);

socket.on(
    "call_rejected",
    () => {

        toast(
            "Arama reddedildi."
        );

        endCall(false);
    }
);

socket.on(
    "call_ended",
    () => {

        toast(
            "Arama sona erdi."
        );

        endCall(false);
    }
);

function loadUserById(
    id
){

    if(
        activeChat?.otherUser?.id ===
        id
    ){
        return activeChat.otherUser;
    }

    return null;
}

$("audioCallButton").onclick =
() =>
    startCall("audio");

$("videoCallButton").onclick =
() =>
    startCall("video");

$("endCallButton").onclick =
() =>
    endCall(true);

function endCall(
    notify = true
){

    if(
        notify &&
        currentCallUserId
    ){

        socket.emit(
            "call_end",
            {
                targetId:
                    currentCallUserId
            }
        );
    }

    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        localStream = null;
    }

    if(peer){

        peer.close();

        peer = null;
    }

    $("remoteVideo")
        .srcObject = null;

    $("localVideo")
        .srcObject = null;

    $("callScreen")
        .classList.add(
            "hidden"
        );

    currentCallUserId = null;
}

$("muteCallButton").onclick =
() => {

    if(!localStream) return;

    const tracks =
        localStream.getAudioTracks();

    callMuted =
        !callMuted;

    tracks.forEach(
        track =>
            track.enabled =
                !callMuted
    );

    $("muteCallButton")
        .textContent =
        callMuted
            ? "🔇"
            : "🎙";
};

$("cameraCallButton").onclick =
() => {

    if(!localStream) return;

    const tracks =
        localStream.getVideoTracks();

    if(!tracks.length){
        return;
    }

    cameraOff =
        !cameraOff;

    tracks.forEach(
        track =>
            track.enabled =
                !cameraOff
    );

    $("cameraCallButton")
        .textContent =
        cameraOff
            ? "🚫"
            : "▣";
};
