<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mesajlaşma</title>

  <!-- Profesyonel ikon kütüphanesi -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080a0f;
      color: #f5f7fb;
      font-family: Inter, system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: min(92%, 520px);
      padding: 40px 28px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      background: rgba(18,21,29,.88);
      box-shadow: 0 25px 80px rgba(0,0,0,.45);
      text-align: center;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 22px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg,#6d5dfc,#20c7d6);
      box-shadow: 0 15px 40px rgba(32,199,214,.2);
    }

    .logo svg {
      width: 38px;
      height: 38px;
      color: white;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    p {
      color: #9da5b5;
      margin-bottom: 28px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(44,211,130,.08);
      border: 1px solid rgba(44,211,130,.15);
      color: #62e6a1;
      font-size: 14px;
    }

    .status svg {
      width: 17px;
      height: 17px;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">
      <i data-lucide="messages-square"></i>
    </div>

    <h1>Mesajlaşma</h1>

    <p>
      Gerçek zamanlı mesajlaşma altyapısı hazır.
    </p>

    <div class="status">
      <i data-lucide="wifi"></i>
      Sunucu bağlantısı aktif
    </div>

  </main>

  <script>
    lucide.createIcons();
  </script>

</body>
</html>
